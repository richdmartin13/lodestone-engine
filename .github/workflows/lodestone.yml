name: Lodestone engine

# Builds the engine on GitHub's own Mac machines (upstream builds on a machine of its own).
on:
  push:
    branches: [lodestone]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      BOOTJDK_NOTE: zulu 8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Tools
        run: brew install make ldid lld coreutils

      - name: Build
        run: |
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix)/bin:$PATH"
          # As upstream's staging build does: the Xcode project builds the app, the Makefile packages it.
          xcodebuild archive -archivePath artifacts/ios -scheme AngelAuraAmethyst -config Debug             AD_HOC_CODE_SIGNING_ALLOWED=1 CODE_SIGN_IDENTITY= BOOTJDK="$JAVA_HOME/bin" | tail -150
          cd artifacts && rm -rf Payload && ln -s ios.xcarchive/Products/Applications Payload && cd ..
          gmake package SLIMMED=1 BOOTJDK="$JAVA_HOME/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: lodestone-engine-ios
          path: artifacts/*.ipa
          if-no-files-found: error
